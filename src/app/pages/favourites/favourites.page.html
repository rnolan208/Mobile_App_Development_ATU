<ion-header>
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Favourites</ion-title>

    <ion-buttons slot="end">
      <!-- Dark Mode Toggle -->
      <ion-button (click)="toggleDarkMode()">
        <ion-icon name="moon-outline"></ion-icon>
      </ion-button>

      <!-- Favourites -->
      <ion-button routerLink="/favourites">
        <ion-icon name="heart-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <h2>My Favourite Movies</h2>

  <div class="movie-grid">

    <div class="movie-tile" *ngFor="let movie of favourites">

      <!-- Clickable area -->
      <div [routerLink]="['/movie', movie.id]">

        <img [src]="movie.poster_path 
          ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path 
          : 'https://via.placeholder.com/150'" />

        <h3>{{ movie.title }}</h3>

        <p>
          {{ movie.overview ? (movie.overview | slice:0:100) + '...' : 'No description available' }}
        </p>

      </div>

      <!-- Remove From Favourites Button -->
      <ion-button color="danger" expand="block" (click)="removeFavourite(movie.id, $event)">
        Remove From Favourites
      </ion-button>

    </div>

  </div>

  <!-- Empty State -->
  <div *ngIf="favourites.length === 0" class="empty">
    <p>No favourites added yet.</p>
  </div>

</ion-content>
